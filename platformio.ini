[platformio]
src_dir = Marlin
boards_dir = buildroot/share/PlatformIO/boards
default_envs = mks_tinybee
include_dir = Marlin
extra_configs = 
	ini/avr.ini
	ini/due.ini
	ini/esp32.ini
	ini/esp32s3.ini
	ini/features.ini
	ini/lpc176x.ini
	ini/native.ini
	ini/samd51.ini
	ini/stm32-common.ini
	ini/stm32f0.ini
	ini/stm32f1-maple.ini
	ini/stm32f1.ini
	ini/stm32f4.ini
	ini/stm32f7.ini
	ini/stm32h7.ini
	ini/stm32g0.ini
	ini/teensy.ini
	ini/renamed.ini

[common]
