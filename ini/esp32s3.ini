#
# Marlin Firmware
# PlatformIO Configuration File
#

#################################
#                               #
#      ESP32-S3 Architecture       #
#                               #
#################################

#
# Espressif ESP32-S3
#
[env:esp32s3]
platform = espressif32@4.4.0
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.variant = esp32s3
build_src_flags   = ${common.build_flags} -DCORE_DEBUG_LEVEL=0 -DARDUINO_USB_CDC_ON_BOOT=0 -DARDUINO_USB_MSC_ON_BOOT=0 -DARDUINO_USB_DFU_ON_BOOT=0 -DCONFIG_IDF_TARGET_ESP32S3=1
build_src_filter    = ${common.default_src_filter}  +<src/HAL/ESP32S3> -<src/HAL/ESP32>
lib_ignore    = NativeEthernet
upload_speed  = 115200
monitor_speed = 115200
#upload_port   = marlinesp.local
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

[env:mks_tinybee_v2]
extends                = env:esp32s3
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
