#
# Marlin Firmware
# PlatformIO Configuration File
#

#################################
#                               #
#      ESP32 Architecture       #
#                               #
#################################

#
# Espressif ESP32
#
#ref: https://github.com/platformio/platform-espressif32/issues/710
[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

board         = esp32dev
build_flags   = ${common.build_flags} -DCORE_DEBUG_LEVEL=0 -DWiFiServer=NetworkServer -DWiFiClient=NetworkClient -I Marlin/src/HAL/ESP32
build_src_filter  = ${common.default_src_filter} +<src/HAL/ESP32> -<src/HAL/ESP32S3>
lib_ignore    = NativeEthernet, SD, SD_MMC, FFat
lib_deps =
  https://github.com/links2004/arduinoWebSockets
  https://github.com/luc-github/ESP32SSDP
upload_speed  = 115200
monitor_speed = 115200
monitor_filters   = colorize, time, send_on_enter, esp32_exception_decoder
#upload_port   = marlinesp.local
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

[env:FYSETC_E4]
extends                = env:esp32
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

[env:PANDA]
extends       = env:esp32
build_flags   = ${env:esp32.build_flags} -DUSE_ESP32_EXIO -DUSE_ESP32_TASK_WDT
lib_deps      = ${common.lib_deps}
  SoftwareSerialEsp32
board_build.partitions = Marlin/src/HAL/ESP32/esp32.csv
upload_speed  = 115200
monitor_speed = 115200

[env:mks_tinybee]
extends                = env:esp32
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
